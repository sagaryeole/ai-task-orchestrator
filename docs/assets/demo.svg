<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Ai Task Orchastrator Demo</title>
  <desc id="desc">Animated terminal-style demo of ai-task-orchastrator</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <style>
      .mono { font-family: Consolas, 'Cascadia Code', Menlo, monospace; }
      .muted { fill: #93a3b8; }
      .txt { fill: #e5e7eb; }
      .ok { fill: #34d399; }
      .warn { fill: #f59e0b; }
      .line { opacity: 0; animation: fadein 12s infinite; }
      .l1 { animation-delay: 0s; }
      .l2 { animation-delay: 1.1s; }
      .l3 { animation-delay: 2.1s; }
      .l4 { animation-delay: 3.2s; }
      .l5 { animation-delay: 4.2s; }
      .l6 { animation-delay: 5.2s; }
      .l7 { animation-delay: 6.4s; }
      .l8 { animation-delay: 7.6s; }
      .l9 { animation-delay: 8.7s; }
      .l10 { animation-delay: 9.6s; }
      @keyframes fadein {
        0% { opacity: 0; }
        10% { opacity: 1; }
        80% { opacity: 1; }
        100% { opacity: 0; }
      }
      .pulse { animation: pulse 1.4s ease-in-out infinite; }
      @keyframes pulse {
        0%,100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="640" rx="24" fill="url(#bg)"/>
  <rect x="30" y="30" width="1140" height="580" rx="14" fill="#0a0f1c" stroke="#243044"/>
  <circle cx="64" cy="58" r="8" fill="#ef4444"/>
  <circle cx="90" cy="58" r="8" fill="#f59e0b"/>
  <circle cx="116" cy="58" r="8" fill="#22c55e"/>
  <text x="150" y="63" class="mono muted" font-size="18">ai-task-orchastrator --once</text>

  <g transform="translate(54,105)">
    <text x="0" y="0" class="mono txt line l1" font-size="23">[15:41:05] Providers: claude=available | copilot=available | ollama=available</text>
    <text x="0" y="42" class="mono txt line l2" font-size="23">[15:41:05] Starting task: Add rate limit fallback docs</text>
    <text x="0" y="84" class="mono txt line l3" font-size="23">[15:41:06] Using provider: claude</text>
    <text x="0" y="126" class="mono warn line l4" font-size="23">[15:41:13] claude rate-limited (429). Cooling down 300s.</text>
    <text x="0" y="168" class="mono txt line l5" font-size="23">[15:41:13] Rotating to next provider: copilot</text>
    <text x="0" y="210" class="mono txt line l6" font-size="23">[15:41:26] verify: python -m unittest discover -s tests</text>
    <text x="0" y="252" class="mono ok line l7" font-size="23">[15:41:29] Task marked complete</text>
    <text x="0" y="294" class="mono txt line l8" font-size="23">[15:41:29] Progress: 14/42 (33%) ETA ~1h 12m</text>
    <text x="0" y="336" class="mono txt line l9" font-size="23">[15:41:29] Auto-commit: Task: Add rate limit fallback docs</text>
    <text x="0" y="378" class="mono ok line l10" font-size="23">[15:41:29] Done. Next task in 45s</text>
  </g>

  <rect x="55" y="548" width="1090" height="10" rx="5" fill="#1f2937"/>
  <rect x="55" y="548" width="523" height="10" rx="5" fill="url(#ok)"/>
  <text x="55" y="538" class="mono muted" font-size="17">Task 14/42</text>
  <rect x="314" y="533" width="10" height="16" rx="3" fill="#34d399" class="pulse"/>
</svg>
